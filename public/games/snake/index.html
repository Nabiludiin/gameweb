<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake Neon</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1115; color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: center; }
    #wrap { text-align: center; }
    canvas { background: #161922; border: 2px solid #00b8e6; border-radius: 12px; max-width: 92vw; max-height: 70vh; }
    p { margin: 8px 0; opacity: .8; }
    #score { font-weight: 700; letter-spacing: .08em; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="score">Skor 0</div>
    <canvas id="c" width="400" height="400"></canvas>
    <p>Panah / WASD untuk belok · Spasi untuk mulai ulang</p>
  </div>
  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const S = 20, N = c.width / S;
    let snake, dir, next, food, score, over, timer;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = next = { x: 1, y: 0 };
      score = 0; over = false;
      place(); draw();
      clearInterval(timer);
      timer = setInterval(step, 110);
    }
    function place() {
      do {
        food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }
    function step() {
      dir = next;
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
        over = true; clearInterval(timer); draw(); return;
      }
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) { score++; place(); } else { snake.pop(); }
      draw();
    }
    function draw() {
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#ff4fa3";
      ctx.fillRect(food.x * S + 2, food.y * S + 2, S - 4, S - 4);
      ctx.fillStyle = "#00e5ff";
      snake.forEach((s, i) => {
        ctx.globalAlpha = i ? 0.8 : 1;
        ctx.fillRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2);
      });
      ctx.globalAlpha = 1;
      document.getElementById("score").textContent = "Skor " + score + (over ? " · Game over (spasi untuk ulang)" : "");
    }
    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      const map = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
      const d = map[k];
      if (d && !(d[0] === -dir.x && d[1] === -dir.y)) { next = { x: d[0], y: d[1] }; e.preventDefault(); }
      if (k === " ") { reset(); e.preventDefault(); }
    });
    reset();
  </script>
</body>
</html>
